<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山西专升本·计算机大类答疑助手</title>
    <!-- Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a237e;
            --primary-light: #3949ab;
            --primary-dark: #0d1452;
            --accent: #00bcd4;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ========== 顶部导航 ========== */
        .header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--primary-light));
            color: #fff;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(26,35,126,0.3);
            z-index: 10;
            flex-shrink: 0;
        }
        .header .logo {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo .icon {
            font-size: 26px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .header .subtitle {
            font-size: 12px;
            opacity: 0.85;
            white-space: nowrap;
        }
        .header .stats {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .header .right-area {
            text-align: right;
        }
        .clear-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 10px;
        }
        .clear-btn:hover {
            background: rgba(255,255,255,0.25);
        }
        /* ========== 快捷按钮栏 ========== */
        .quick-bar {
            background: #fff;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            scrollbar-width: thin;
        }
        .quick-bar::-webkit-scrollbar { height: 4px; }
        .quick-bar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
        .quick-btn {
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: #fff;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .quick-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f5f7ff;
            transform: translateY(-1px);
        }
        .quick-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(26,35,126,0.3);
        }
        /* ========== 聊天区域 ========== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 3px; }
        .chat-container::-webkit-scrollbar-thumb:hover { background: #aaa; }

        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.75;
            word-break: break-word;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 12px rgba(26,35,126,0.25);
        }
        .message.bot {
            align-self: flex-start;
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }

        /* ========== Markdown 内容样式 ========== */
        .message.bot p { margin: 6px 0; }
        .message.bot p:first-child { margin-top: 0; }
        .message.bot p:last-child { margin-bottom: 0; }
        .message.bot h3 {
            font-size: 16px;
            margin: 12px 0 6px;
            color: var(--primary);
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }
        .message.bot h3:first-child { margin-top: 0; }
        .message.bot strong { color: var(--primary); font-weight: 600; }
        .message.bot ul, .message.bot ol { margin: 6px 0; padding-left: 22px; }
        .message.bot li { margin: 3px 0; }
        .message.bot code {
            background: #f0f0f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: "Consolas", "Source Code Pro", monospace;
            color: #c62828;
        }
        .message.bot pre {
            background: #1e1e2e;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            position: relative;
        }
        .message.bot pre code {
            display: block;
            padding: 14px 16px;
            background: transparent;
            color: #e0e0e0;
            font-size: 13px;
            line-height: 1.6;
        }
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ccc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .message.bot table {
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13px;
            width: 100%;
        }
        .message.bot th, .message.bot td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        .message.bot th {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-weight: 600;
        }
        .message.bot tr:nth-child(even) { background: #f9f9fc; }
        .message.bot blockquote {
            border-left: 4px solid var(--accent);
            padding: 8px 14px;
            margin: 8px 0;
            background: #f0f7ff;
            border-radius: 0 8px 8px 0;
            color: var(--text-light);
        }
        .message.bot hr {
            border: none;
            border-top: 1px dashed var(--border);
            margin: 12px 0;
        }

        /* ========== 打字动画 ========== */
        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 6px 0;
        }
        .typing span {
            width: 9px;
            height: 9px;
            background: var(--primary-light);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* ========== 示例问题 ========== */
        .example-questions {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .example-tag {
            background: #f0f4ff;
            border: 1px solid #c5cae9;
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .example-tag:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ========== 输入区域 ========== */
        .input-area {
            background: #fff;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,35,126,0.1);
        }
        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(26,35,126,0.3);
        }
        .send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,35,126,0.4); }
        .send-btn:active { transform: translateY(0); }
        .send-btn:disabled { background: #bbb; cursor: not-allowed; box-shadow: none; transform: none; }

        /* ========== 移动端适配 ========== */
        @media (max-width: 768px) {
            .message { max-width: 92%; font-size: 13px; }
            .header .subtitle { display: none; }
            .header .logo { font-size: 15px; }
            .header .logo .icon { font-size: 22px; }
            .send-btn { padding: 12px 16px; }
            .input-area input { padding: 10px 14px; }
            .quick-btn { padding: 6px 12px; font-size: 12px; }
            .message.bot pre code { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span class="icon">🎓</span>
            <div>
                <div>山西专升本·计算机大类答疑助手</div>
                <div class="stats">知识库 36 条 · 题库 19 道</div>
            </div>
        </div>
        <div class="right-area">
            <div class="subtitle">C程序设计 | 高等数学 | 公共英语 | 计算机基础</div>
            <button class="clear-btn" onclick="clearChat()">清空对话</button>
        </div>
    </div>

    <div class="quick-bar">
        <button class="quick-btn" onclick="sendQuick('考试信息 分值题型')">📋 考试信息</button>
        <button class="quick-btn" onclick="sendQuick('高数 极限')">📐 高数-极限</button>
        <button class="quick-btn" onclick="sendQuick('高数 求导公式')">📐 高数-求导</button>
        <button class="quick-btn" onclick="sendQuick('高数 积分公式')">📐 高数-积分</button>
        <button class="quick-btn" onclick="sendQuick('C语言 指针')">💻 C语言-指针</button>
        <button class="quick-btn" onclick="sendQuick('C语言 数组')">💻 C语言-数组</button>
        <button class="quick-btn" onclick="sendQuick('C语言 函数 参数传递')">💻 C语言-函数</button>
        <button class="quick-btn" onclick="sendQuick('英语 时态')">📖 英语-时态</button>
        <button class="quick-btn" onclick="sendQuick('英语 虚拟语气')">📖 英语-虚拟语气</button>
        <button class="quick-btn" onclick="practice('')">🎲 随机刷题</button>
        <button class="quick-btn" onclick="practice('高等数学')">📝 高数刷题</button>
        <button class="quick-btn" onclick="practice('C语言程序设计')">📝 C语言刷题</button>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message bot" id="welcomeMsg"></div>
    </div>

    <div class="input-area">
        <input type="text" id="inputBox" placeholder="输入问题，如：高数 极限怎么求 / C语言 指针怎么用..."
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script>
        // ========== 初始化 Markdown ==========
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        const chatBox = document.getElementById('chatBox');
        const inputBox = document.getElementById('inputBox');
        const sendBtn = document.getElementById('sendBtn');

        // ========== 渲染欢迎消息 ==========
        document.getElementById('welcomeMsg').innerHTML = marked.parse(
            '👋 你好！我是**山西统招专升本·计算机大类答疑助手**。\n\n' +
            '我可以帮你：\n' +
            '1. **讲解知识点**（高数、C语言、英语、计算机基础）\n' +
            '2. **查看考试信息**（分值、题型、时长）\n' +
            '3. **刷题练习**（随机出题，每次3道）\n' +
            '4. **解题答疑**（发题目给我，给答案+解析）\n\n' +
            '直接输入问题，或点击下方示例开始：'
        ) + renderExampleQuestions();

        function renderExampleQuestions() {
            const examples = [
                { text: '什么是等价无穷小？', q: '高数 等价无穷小' },
                { text: 'C语言指针怎么用？', q: 'C语言 指针' },
                { text: 'switch语句怎么用？', q: 'C语言 switch' },
                { text: '求导公式有哪些？', q: '高数 求导公式' },
            ];
            let html = '<div class="example-questions">';
            for (const ex of examples) {
                html += `<span class="example-tag" onclick="sendQuick('${ex.q}')">${ex.text}</span>`;
            }
            html += '</div>';
            return html;
        }

        // ========== 添加消息 ==========
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'bot');
            if (isUser) {
                div.textContent = text;
            } else {
                div.innerHTML = renderBotContent(text);
                // 为代码块添加复制按钮
                addCopyButtons(div);
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderBotContent(text) {
            if (!text) return '<p>（空）</p>';
            try {
                return marked.parse(text);
            } catch (e) {
                // 降级处理
                return '<pre>' + text.replace(/</g, '&lt;') + '</pre>';
            }
        }

        function addCopyButtons(container) {
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = '复制';
                btn.onclick = function() {
                    const code = pre.querySelector('code');
                    const text = code ? code.textContent : pre.textContent;
                    navigator.clipboard.writeText(text).then(() => {
                        btn.textContent = '已复制 ✓';
                        setTimeout(() => { btn.textContent = '复制'; }, 2000);
                    }).catch(() => {
                        btn.textContent = '复制失败';
                        setTimeout(() => { btn.textContent = '复制'; }, 2000);
                    });
                };
                pre.appendChild(btn);
            });
        }

        // ========== 打字动画 ==========
        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ========== 查询处理 ==========
        function processQuery(text) {
            return new Promise(resolve => {
                setTimeout(() => {
                    if (text.startsWith('查看答案')) {
                        const parts = text.split(/\s+/);
                        if (parts.length >= 2) {
                            const idx = parseInt(parts[1]);
                            if (!isNaN(idx)) {
                                resolve(showAnswer(idx));
                                return;
                            }
                        }
                        resolve('格式：`查看答案 题号`，例如：`查看答案 1`');
                        return;
                    }
                    resolve(answer(text));
                }, 400);
            });
        }

        // ========== 发送消息 ==========
        async function sendMessage() {
            const text = inputBox.value.trim();
            if (!text) return;
            addMessage(text, true);
            inputBox.value = '';
            sendBtn.disabled = true;
            addTyping();
            try {
                const reply = await processQuery(text);
                removeTyping();
                addMessage(reply, false);
            } catch (e) {
                removeTyping();
                addMessage('处理出错，请重试。', false);
            }
            sendBtn.disabled = false;
            inputBox.focus();
        }

        async function sendQuick(text) {
            addMessage(text, true);
            addTyping();
            try {
                const reply = await processQuery(text);
                removeTyping();
                addMessage(reply, false);
            } catch (e) {
                removeTyping();
                addMessage('处理出错，请重试。', false);
            }
        }

        async function practice(subject) {
            const displayText = subject ? `刷题 ${subject}` : '随机刷题';
            addMessage(displayText, true);
            addTyping();
            try {
                const reply = await processQuery(displayText);
                removeTyping();
                addMessage(reply, false);
            } catch (e) {
                removeTyping();
                addMessage('处理出错，请重试。', false);
            }
        }

        // ========== 清空对话 ==========
        function clearChat() {
            chatBox.innerHTML = '';
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'message bot';
            welcomeDiv.innerHTML = marked.parse(
                '👋 对话已清空。输入新问题开始吧！\n\n' +
                '你可以：\n' +
                '- 输入**知识点**关键词，如 `极限`、`指针`、`积分`\n' +
                '- 输入**考试信息**查看分值和题型\n' +
                '- 点击上方**刷题**按钮开始练习'
            ) + renderExampleQuestions();
            chatBox.appendChild(welcomeDiv);
            _currentQuestions = [];
        }

        inputBox.focus();
    </script>
</body>
</html>
