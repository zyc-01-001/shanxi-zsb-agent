<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山西专升本·计算机大类答疑助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f0f2f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header .logo {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .logo span.icon { font-size: 24px; }
        .header .subtitle { font-size: 12px; opacity: 0.8; }
        .quick-bar {
            background: #fff;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid #e8e8e8;
        }
        .quick-btn {
            padding: 6px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: #fff;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            border-color: #1a237e;
            color: #1a237e;
        }
        .quick-btn.active {
            background: #1a237e;
            color: #fff;
            border-color: #1a237e;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #1a237e;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #fff;
            color: #333;
            border: 1px solid #e8e8e8;
            border-bottom-left-radius: 4px;
        }
        .message.bot pre {
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            margin: 8px 0;
        }
        .message.bot code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
        }
        .message.bot table {
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 13px;
        }
        .message.bot th, .message.bot td {
            border: 1px solid #ddd;
            padding: 6px 12px;
        }
        .message.bot th {
            background: #f5f5f5;
            font-weight: bold;
        }
        .message.bot strong { color: #1a237e; }
        .message.bot h3 {
            font-size: 15px;
            margin-bottom: 6px;
            color: #1a237e;
        }
        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        .input-area {
            background: #fff;
            padding: 12px 16px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #1a237e; }
        .input-area button {
            padding: 10px 20px;
            background: #1a237e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover { background: #283593; }
        .input-area button:disabled { background: #bbb; cursor: not-allowed; }
        @media (max-width: 768px) {
            .message { max-width: 92%; }
            .header .subtitle { display: none; }
            .input-area button { padding: 10px 14px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span class="icon">🎓</span>
            <span>山西专升本·计算机大类答疑助手</span>
        </div>
        <div class="subtitle">C程序设计 | 高等数学 | 公共英语 | 计算机基础</div>
    </div>

    <div class="quick-bar">
        <button class="quick-btn" onclick="sendQuick('考试信息 分值题型')">📋 考试信息</button>
        <button class="quick-btn" onclick="sendQuick('高数 极限')">📐 高数-极限</button>
        <button class="quick-btn" onclick="sendQuick('高数 求导公式')">📐 高数-求导</button>
        <button class="quick-btn" onclick="sendQuick('高数 积分公式')">📐 高数-积分</button>
        <button class="quick-btn" onclick="sendQuick('C语言 指针')">💻 C语言-指针</button>
        <button class="quick-btn" onclick="sendQuick('C语言 数组')">💻 C语言-数组</button>
        <button class="quick-btn" onclick="sendQuick('C语言 函数')">💻 C语言-函数</button>
        <button class="quick-btn" onclick="sendQuick('英语 时态')">📖 英语-时态</button>
        <button class="quick-btn" onclick="sendQuick('英语 虚拟语气')">📖 英语-虚拟语气</button>
        <button class="quick-btn" onclick="practice('')">📝 随机刷题</button>
        <button class="quick-btn" onclick="practice('高等数学')">📝 高数刷题</button>
        <button class="quick-btn" onclick="practice('C语言程序设计')">📝 C语言刷题</button>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message bot">
            👋 你好！我是<strong>山西统招专升本·计算机大类答疑助手</strong>。<br><br>
            我可以帮你：<br>
            1. 讲解知识点（高数、C语言、英语、计算机基础）<br>
            2. 查看考试信息（分值、题型、时长）<br>
            3. 刷题练习（随机出题，每次3道）<br>
            4. 解题答疑（发题目给我，给答案+解析）<br><br>
            直接输入问题，或点击上方快捷按钮开始吧！
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="inputBox" placeholder="输入问题，如：高数 极限怎么求 / C语言 指针怎么用..."
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script>
        const chatBox = document.getElementById('chatBox');
        const inputBox = document.getElementById('inputBox');
        const sendBtn = document.getElementById('sendBtn');

        function renderMarkdown(text) {
            if (!text) return '';
            text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            text = text.replace(/```c\n([\s\S]*?)```/g, '<pre>$1</pre>');
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre>$2</pre>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/^\|(.+)\|$/gm, function(match) {
                const cells = match.split('|').filter(c => c.trim());
                if (cells.some(c => c.includes('---'))) return '';
                return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
            });
            const lines = text.split('\n');
            let inTable = false;
            let result = [];
            for (let line of lines) {
                if (line.includes('<tr>')) {
                    if (!inTable) { result.push('<table border="1" style="border-collapse:collapse;margin:8px 0;font-size:13px;">'); inTable = true; }
                    result.push(line);
                } else if (line.includes('---')) {
                    continue;
                } else {
                    if (inTable) { result.push('</table>'); inTable = false; }
                    result.push(line);
                }
            }
            if (inTable) result.push('</table>');
            text = result.join('\n');
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/<br>(<tr>)/g, '$1');
            text = text.replace(/(<\/tr>)<br>/g, '$1');
            text = text.replace(/<br>(<\/table>)/g, '$1');
            text = text.replace(/(<table[^>]*>)<br>/g, '$1');
            return text;
        }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'bot');
            if (isUser) {
                div.textContent = text;
            } else {
                div.innerHTML = renderMarkdown(text);
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function processQuery(text) {
            // 模拟网络延迟
            return new Promise(resolve => {
                setTimeout(() => {
                    if (text.startsWith('查看答案')) {
                        const parts = text.split(/\s+/);
                        if (parts.length >= 2) {
                            const idx = parseInt(parts[1]);
                            if (!isNaN(idx)) {
                                resolve(showAnswer(idx));
                                return;
                            }
                        }
                        resolve('格式：查看答案 题号，例如：查看答案 1');
                        return;
                    }
                    resolve(answer(text));
                }, 300);
            });
        }

        async function sendMessage() {
            const text = inputBox.value.trim();
            if (!text) return;
            addMessage(text, true);
            inputBox.value = '';
            sendBtn.disabled = true;
            addTyping();
            try {
                const reply = await processQuery(text);
                removeTyping();
                addMessage(reply, false);
            } catch (e) {
                removeTyping();
                addMessage('处理出错，请重试。', false);
            }
            sendBtn.disabled = false;
            inputBox.focus();
        }

        async function sendQuick(text) {
            addMessage(text, true);
            addTyping();
            try {
                const reply = await processQuery(text);
                removeTyping();
                addMessage(reply, false);
            } catch (e) {
                removeTyping();
                addMessage('处理出错，请重试。', false);
            }
        }

        async function practice(subject) {
            const displayText = subject ? `刷题 ${subject}` : '随机刷题';
            addMessage(displayText, true);
            addTyping();
            try {
                const reply = await processQuery(displayText);
                removeTyping();
                addMessage(reply, false);
            } catch (e) {
                removeTyping();
                addMessage('处理出错，请重试。', false);
            }
        }

        inputBox.focus();
    </script>
</body>
</html>
